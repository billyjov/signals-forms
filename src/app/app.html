<header class="border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-6 py-5 flex flex-col gap-4">
    <a routerLink="/" class="font-medium text-gray-900 hover:text-gray-700 transition-colors">
      Signals und Formulare als Modell reaktiver Validierung in Angular
    </a>
    <nav class="flex flex-wrap gap-x-4 gap-y-2">
      @for (item of menuItems; track item.label) {
        <div class="text-sm">
          <a [routerLink]="item.route" class="text-gray-600 hover:text-gray-900 transition-colors">
            {{ item.label }}
          </a>
        </div>
      }
    </nav>
  </div>
</header>

<router-outlet />
