<div class="max-w-2xl mx-auto p-4 space-y-4">
  <button (click)="addItem()" class="border px-2 py-1">Add</button>

  @for (item of items.controls; track trackByIndex($index)) {
    <div [formGroup]="item" class="border p-2 space-y-2">
      <input formControlName="name" class="border p-1 w-full" placeholder="Name" />
      <input type="number" formControlName="quantity" class="border p-1 w-full" />

      <button (click)="removeItem($index)" class="border px-2">Remove</button>
    </div>
  }
</div>
