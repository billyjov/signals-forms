<div class="max-w-2xl mx-auto p-4 space-y-4">
  <input type="date" [formField]="form.checkIn" class="border p-2 w-full" />

  <input type="date" [formField]="form.checkOut" class="border p-2 w-full" />

  @if (form.checkOut().invalid() && form.checkOut().touched()) {
    <div class="text-red-600">
      {{ form.checkOut().errors()[0].message }}
    </div>
  }
</div>
